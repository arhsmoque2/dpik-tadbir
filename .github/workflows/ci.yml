name: Quality Gate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-and-spec-hygiene:
    name: "Gate 1: Docs, Lexicon & Spec Hygiene"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Markdown Structure (markdownlint)
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Validate JSON Schemas
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "docs/ui-spec/navigation-tree.json",
              "docs/testing/coverage-risk-matrix.json",
              ".cspell.json"
            ];
            files.forEach(f => {
              if (fs.existsSync(f)) {
                JSON.parse(fs.readFileSync(f, "utf8"));
                console.log("Valid JSON:", f);
              }
            });
          '

      - name: Spelling & Lexicon Hygiene (cspell)
        run: npx --yes cspell --no-progress "**/*.md" "docs/**/*.json"

  security-and-secrets:
    name: "Gate 2: Secret & Policy Preflight"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    name: "Gate 1: PHP Lint, Typecheck & Unused Audit"
    runs-on: ubuntu-latest
    needs: [doc-and-spec-hygiene, security-and-secrets]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if composer.json exists
        id: check_composer
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> $GITHUB_OUTPUT
          else
            echo "has_composer=false" >> $GITHUB_OUTPUT
            echo "No composer.json found (specifications phase) — skipping PHP static analysis."
          fi

      - name: Setup PHP
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint Code Style Check
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/pint --test

      - name: Run Larastan / PHPStan (Level 8)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/phpstan analyse --level=8 --memory-limit=1G

      - name: Run Composer Unused Audit
        if: steps.check_composer.outputs.has_composer == 'true'
        run: |
          if [ -f "./vendor/bin/composer-unused" ]; then
            ./vendor/bin/composer-unused
          fi

  test-and-coverage:
    name: "Gate 3: Hermetic Tests & 90% Diff-Cover"
    runs-on: ubuntu-latest
    needs: [doc-and-spec-hygiene, security-and-secrets]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if composer.json exists
        id: check_composer
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> $GITHUB_OUTPUT
          else
            echo "has_composer=false" >> $GITHUB_OUTPUT
            echo "No composer.json found (specifications phase) — skipping test suite."
          fi

      - name: Setup PHP
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Install Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Hermetic Pest Suite (Unit, Integration, Security Policies)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/pest --coverage-clover coverage.xml --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing

      - name: Setup uv for diff-cover
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Enforce 90% Incremental Diff Coverage Gate
        if: steps.check_composer.outputs.has_composer == 'true' && github.event_name == 'pull_request'
        run: |
          uvx diff-cover coverage.xml \
            --compare-branch origin/${{ github.base_ref }} \
            --fail-under 90

  ui-layout-audit:
    name: "Gate 4: Playwright UI & Layout Audit"
    runs-on: ubuntu-latest
    needs: [static-analysis, test-and-coverage]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if application and tests are scaffolded
        id: check_ui
        run: |
          if [ -f "composer.json" ] && [ -d "tests/Browser" ]; then
            echo "has_ui_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_ui_tests=false" >> $GITHUB_OUTPUT
            echo "UI and browser test suite not yet scaffolded (specifications phase) — skipping Playwright layout audit."
          fi

      - name: Run Playwright Layout & State Auditor
        if: steps.check_ui.outputs.has_ui_tests == 'true'
        run: |
          npx playwright test --config=playwright.config.ts
