name: Quality Gate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: "Classify changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      php: ${{ steps.classify.outputs.php }}
      ui: ${{ steps.classify.outputs.ui }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: classify
        name: Classify modified surfaces
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-changes.mjs

  doc-and-spec-hygiene:
    name: "Gate 1: Docs, Lexicon & Spec Hygiene"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Markdown Structure (markdownlint)
        run: npx --yes markdownlint-cli2 --config .markdownlint-cli2.jsonc

      - name: Validate JSON Schemas & Spec Contracts
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "docs/ui-spec/navigation-tree.json",
              "docs/testing/coverage-risk-matrix.json",
              ".cspell.json"
            ];
            files.forEach(f => {
              if (fs.existsSync(f)) {
                JSON.parse(fs.readFileSync(f, "utf8"));
                console.log("Valid JSON:", f);
              }
            });
          '

      - name: Spelling & Lexicon Hygiene (cspell)
        run: npx --yes cspell --no-progress "**/*.md" "docs/**/*.json"

  security-and-secrets:
    name: "Gate 2: Fast Static Secret Scanner (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks Binary
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scanner
        run: gitleaks detect --source=. --verbose --redact

  static-analysis:
    name: "Gate 1: PHP Lint, Typecheck & Unused Audit"
    runs-on: ubuntu-latest
    needs: [changes, doc-and-spec-hygiene, security-and-secrets]
    if: needs.changes.outputs.php == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if composer.json exists
        id: check_composer
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> $GITHUB_OUTPUT
          else
            echo "has_composer=false" >> $GITHUB_OUTPUT
            echo "No composer.json found (specifications phase) — skipping PHP static analysis."
          fi

      - name: Setup PHP
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        if: steps.check_composer.outputs.has_composer == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint Code Style Check
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/pint --test

      - name: Run Larastan / PHPStan (Level 8)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/phpstan analyse --level=8 --memory-limit=1G

      - name: Run Filament v4 Static Analysis (FilaCheck)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: |
          if [ -f "./vendor/bin/filacheck" ]; then
            ./vendor/bin/filacheck app/Filament
          else
            php vendor/laraveldaily/filacheck/bin/filacheck app/Filament
          fi

      - name: Run Composer Unused Audit
        if: steps.check_composer.outputs.has_composer == 'true'
        run: |
          if [ -f "./vendor/bin/composer-unused" ]; then
            ./vendor/bin/composer-unused
          fi

  tadbir-tooling:
    name: "Gate: Tadbir control plane & snip filters"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Tadbir CLI test suite (ruff, mypy, pytest)
        working-directory: tools/tadbir_cli
        run: |
          uv sync --quiet
          uv run ruff check .
          uv run mypy src
          uv run pytest -q
        # test_snip_filters.py structurally validates .snip/filters/*.yaml here
        # (no snip binary on CI); full `snip verify` runs locally via snip-setup.

  test-and-coverage:
    name: "Gate 3: Hermetic Tests & Diff-Cover"
    runs-on: ubuntu-latest
    needs: [changes, doc-and-spec-hygiene, security-and-secrets]
    if: needs.changes.outputs.php == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if composer.json exists
        id: check_composer
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> $GITHUB_OUTPUT
          else
            echo "has_composer=false" >> $GITHUB_OUTPUT
            echo "No composer.json found (specifications phase) — skipping test suite."
          fi

      - name: Setup PHP
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: xdebug
          tools: composer:v2

      - name: Get Composer Cache Directory
        if: steps.check_composer.outputs.has_composer == 'true'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Hermetic Pest Suite (Unit, Integration, AI Resilience)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/pest --coverage-clover coverage.xml --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing

      - name: Setup uv for diff-cover
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Enforce Incremental Diff Coverage Gate
        if: steps.check_composer.outputs.has_composer == 'true' && github.event_name == 'pull_request'
        run: |
          uvx diff-cover coverage.xml \
            --compare-branch origin/${{ github.base_ref }} \
            --fail-under 85
