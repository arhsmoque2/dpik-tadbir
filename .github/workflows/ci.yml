name: Quality Gate CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: "Classify changed paths"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      php: ${{ steps.classify.outputs.php }}
      ui: ${{ steps.classify.outputs.ui }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: classify
        name: Classify modified surfaces
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          QUALITY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-changes.mjs

  doc-and-spec-hygiene:
    name: "Gate 1: Docs, Lexicon & Spec Hygiene (Declared vs Built)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Markdown Structure (markdownlint)
        run: npx --yes markdownlint-cli2 --config .markdownlint-cli2.jsonc

      - name: Validate JSON Schemas & Spec Contracts
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "docs/ui-spec/navigation-tree.json",
              "docs/testing/coverage-risk-matrix.json",
              ".cspell.json"
            ];
            files.forEach(f => {
              if (fs.existsSync(f)) {
                JSON.parse(fs.readFileSync(f, "utf8"));
                console.log("Valid JSON:", f);
              }
            });
          '

      - name: Spelling & Lexicon Hygiene (cspell)
        run: npx --yes cspell --no-progress "**/*.md" "docs/**/*.json"

  security-and-secrets:
    name: "Gate 2: Secret & Policy Preflight"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks Binary
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scanner
        run: gitleaks detect --source=. --verbose --redact

      - name: Setup PHP for Security Preflight
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Security & Policy Preflight Tests
        run: |
          ./vendor/bin/pest \
            tests/Feature/Auth \
            tests/Feature/Policies \
            tests/Feature/Mcp/WriteSafetyProposalTest.php \
            tests/Feature/Ai/PiiStorageSanitizationTest.php
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing

  static-analysis:
    name: "Gate 1: PHP Lint, Typecheck & Unused Audit"
    runs-on: ubuntu-latest
    needs: [doc-and-spec-hygiene, security-and-secrets]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if composer.json exists
        id: check_composer
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> $GITHUB_OUTPUT
          else
            echo "has_composer=false" >> $GITHUB_OUTPUT
            echo "No composer.json found (specifications phase) — skipping PHP static analysis."
          fi

      - name: Setup PHP
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Pint Code Style Check
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/pint --test

      - name: Run Larastan / PHPStan (Level 8)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/phpstan analyse --level=8 --memory-limit=1G

      - name: Run Filament v4 Static Analysis (FilaCheck)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: |
          if [ -f "./vendor/bin/filacheck" ]; then
            ./vendor/bin/filacheck app/Filament
          else
            php vendor/laraveldaily/filacheck/bin/filacheck app/Filament
          fi

      - name: Run Composer Unused Audit
        if: steps.check_composer.outputs.has_composer == 'true'
        run: |
          if [ -f "./vendor/bin/composer-unused" ]; then
            ./vendor/bin/composer-unused
          fi

  test-and-coverage:
    name: "Gate 3: Hermetic Tests & 90% Diff-Cover"
    runs-on: ubuntu-latest
    needs: [doc-and-spec-hygiene, security-and-secrets]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if composer.json exists
        id: check_composer
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> $GITHUB_OUTPUT
          else
            echo "has_composer=false" >> $GITHUB_OUTPUT
            echo "No composer.json found (specifications phase) — skipping test suite."
          fi

      - name: Setup PHP
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Install Composer Dependencies
        if: steps.check_composer.outputs.has_composer == 'true'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Hermetic Pest Suite (Unit, Integration, AI Resilience)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: ./vendor/bin/pest --coverage-clover coverage.xml --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          APP_ENV: testing

      - name: Setup uv for diff-cover
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Enforce 90% Incremental Diff Coverage Gate
        if: steps.check_composer.outputs.has_composer == 'true' && github.event_name == 'pull_request'
        run: |
          uvx diff-cover coverage.xml \
            --compare-branch origin/${{ github.base_ref }} \
            --fail-under 90

  ui-layout-audit:
    name: "Gate 4: Playwright E2E, Visual & Accessibility QA"
    runs-on: ubuntu-latest
    needs: [changes, static-analysis, test-and-coverage]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || needs.changes.outputs.ui == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install Node Dependencies
        run: pnpm install

      - name: Install Playwright Browsers with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Bootstrap Test Environment & File-Backed Database
        run: |
          cp .env.example .env.testing
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=database/testing.sqlite|g' .env.testing
          sed -i 's|SESSION_DRIVER=.*|SESSION_DRIVER=database|g' .env.testing
          sed -i 's|CACHE_STORE=.*|CACHE_STORE=database|g' .env.testing
          php artisan key:generate --env=testing
          touch database/testing.sqlite
          php artisan migrate:fresh --seed --env=testing --force

      - name: Run Playwright E2E & Visual Regression Suite
        run: npx playwright test --config=playwright.config.ts
        env:
          CI: true
          APP_ENV: testing

      - name: Upload Playwright Test Artifacts & Visual Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
