name: Weekly Quality & Mutation Audit

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-audit:
    name: "Exhaustive Mutation Testing Gate (Pest --mutate)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Mutation Testing Suite
        run: ./vendor/bin/pest --mutate --covered-only --parallel --min=70
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing

  accessibility-deep-audit:
    name: "Deep Accessibility Audit (Lens for Laravel)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Puppeteer Dependencies for Browsershot
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Bootstrap Environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force

      - name: Run Lens WCAG 2.1 AA Audit
        run: |
          php artisan serve --port=8000 &
          sleep 5
          php artisan lens:audit http://127.0.0.1:8000/admin/login --wcag=2.1 --aa
