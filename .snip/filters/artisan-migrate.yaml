name: "artisan-migrate"
version: 1
description: "php artisan migrate*: collapse the per-migration DONE rows into a single count, keep any FAIL / SQLSTATE / rollback lines verbatim"

match:
  command: "php"
  subcommand: "artisan"
  require_flags: ["migrate"]

streams: ["stdout", "stderr"]

pipeline:
  - action: "strip_ansi"
  - action: "replace"
    pattern: "^\\s+"
    replacement: ""
  - action: "replace"
    pattern: "\\s*\\.{3,}\\s*"
    replacement: "  "
  - action: "keep_lines"
    pattern: "(DONE$|\\bFAIL\\b|Exception|SQLSTATE|Nothing to migrate|Rolling back|rolled back|Migrating:|migration table)"
  - action: "aggregate"
    patterns:
      done: "DONE$"
    format: "{{if .done}}applied: {{.done}} migration(s){{end}}"
    append: true
  - action: "remove_lines"
    pattern: "DONE$"
  - action: "remove_lines"
    pattern: "^\\s*$"
  - action: "on_empty"
    message: "no migration output"

on_error: "passthrough"

tests:
  - name: "many DONE rows collapse to a single count"
    input: |
      INFO  Running migrations.

      0001_01_01_000000_create_users_table ................... 12.34ms DONE
      0001_01_01_000001_create_cache_table .................... 4.11ms DONE
      0001_01_01_000002_create_jobs_table .................... 6.02ms DONE
    expected: |
      applied: 3 migration(s)

  - name: "a failing migration keeps the SQLSTATE line"
    input: |
      2026_09_01_000007_add_imap_credentials .......... 3.01ms DONE
      2026_09_02_000001_add_widget_slots ............. FAIL

      SQLSTATE[42S21]: Column already exists: 1060 duplicate column name 'widget_slots'
    expected: |
      2026_09_02_000001_add_widget_slots  FAIL
      SQLSTATE[42S21]: Column already exists: 1060 duplicate column name 'widget_slots'
      applied: 1 migration(s)

  - name: "nothing pending"
    input: |
      INFO  Nothing to migrate.
    expected: |
      INFO  Nothing to migrate.
