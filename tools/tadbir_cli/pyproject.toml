[project]
name = "tadbir-cli"
version = "0.1.0"
description = "Deterministic runtime control plane and quality gate harness for DPIK Tadbir"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tadbir = "tadbir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tadbir"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pyyaml>=6.0",          # test-only: structural validation of .snip/filters/*.yaml
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
